<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Shield shape -->
  <path d="M16 1 L30 6 L30 15 C30 23 22 29 16 31 C10 29 2 23 2 15 L2 6 Z" fill="#171717" stroke="#e23b2e" stroke-width="1.2"/>
  <!-- Shield inner border -->
  <path d="M16 3 L28 7 L28 15 C28 22 21 27.5 16 29.5 C11 27.5 4 22 4 15 L4 7 Z" fill="none" stroke="#e23b2e" stroke-width="0.4" opacity="0.4"/>
  <!-- Open book center -->
  <!-- Left page -->
  <path d="M8 12 L15.5 12 L15.5 22 L8 22 Z" fill="#f1eee8"/>
  <!-- Right page -->
  <path d="M16.5 12 L24 12 L24 22 L16.5 22 Z" fill="#f1eee8"/>
  <!-- Book spine -->
  <line x1="16" y1="11" x2="16" y2="23" stroke="#d7d1c8" stroke-width="0.8"/>
  <!-- Book cover hints -->
  <path d="M7.5 11.5 L16 11.5" stroke="#8B0000" stroke-width="0.5" opacity="0.5"/>
  <path d="M16 11.5 L24.5 11.5" stroke="#8B0000" stroke-width="0.5" opacity="0.5"/>
  <path d="M7.5 22.5 L16 22.5" stroke="#8B0000" stroke-width="0.5" opacity="0.5"/>
  <path d="M16 22.5 L24.5 22.5" stroke="#8B0000" stroke-width="0.5" opacity="0.5"/>
  <!-- Text lines on left page -->
  <line x1="9.5" y1="14" x2="14" y2="14" stroke="#d7d1c8" stroke-width="0.4"/>
  <line x1="9.5" y1="15.5" x2="13.5" y2="15.5" stroke="#d7d1c8" stroke-width="0.4"/>
  <line x1="9.5" y1="17" x2="14" y2="17" stroke="#d7d1c8" stroke-width="0.4"/>
  <line x1="9.5" y1="18.5" x2="13" y2="18.5" stroke="#d7d1c8" stroke-width="0.4"/>
  <line x1="9.5" y1="20" x2="13.5" y2="20" stroke="#d7d1c8" stroke-width="0.4"/>
  <!-- Text lines on right page -->
  <line x1="18" y1="14" x2="22.5" y2="14" stroke="#d7d1c8" stroke-width="0.4"/>
  <line x1="18" y1="15.5" x2="22" y2="15.5" stroke="#d7d1c8" stroke-width="0.4"/>
  <line x1="18" y1="17" x2="22.5" y2="17" stroke="#d7d1c8" stroke-width="0.4"/>
  <line x1="18" y1="18.5" x2="21.5" y2="18.5" stroke="#d7d1c8" stroke-width="0.4"/>
  <!-- Crossed swords behind book -->
  <!-- Left sword -->
  <line x1="5" y1="4" x2="16" y2="18" stroke="#f1eee8" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Right sword -->
  <line x1="27" y1="4" x2="16" y2="18" stroke="#f1eee8" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Sword tips -->
  <polygon points="4.5,3.5 5.5,3.5 5,5" fill="#f2bd3d"/>
  <polygon points="26.5,3.5 27.5,3.5 27,5" fill="#f2bd3d"/>
  <!-- Crossguards -->
  <line x1="3.5" y1="5.5" x2="6.5" y2="5.5" stroke="#f2bd3d" stroke-width="1" stroke-linecap="round"/>
  <line x1="25.5" y1="5.5" x2="28.5" y2="5.5" stroke="#f2bd3d" stroke-width="1" stroke-linecap="round"/>
  <!-- Sparkles at sword tips -->
  <circle cx="4.5" cy="3" r="0.6" fill="#f2bd3d" opacity="0.8"/>
  <circle cx="27.5" cy="3" r="0.6" fill="#f2bd3d" opacity="0.8"/>
  <!-- Star sparkle top center -->
  <polygon points="16,1 16.4,2 17.5,2 16.7,2.6 17,3.6 16,3 15,3.6 15.3,2.6 14.5,2 15.6,2" fill="#f2bd3d" opacity="0.9"/>
</svg>